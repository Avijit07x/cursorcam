<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Motion</title>
    <style>
      body {
        font:
          16px system-ui,
          sans-serif;
        margin: 40px;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      #pulse {
        animation: pulse 0.8s infinite;
        padding: 10px 20px;
      }
      #fade {
        opacity: 0;
        transition: opacity 0.6s;
      }
      #fade.shown {
        opacity: 1;
      }
      #ghost {
        opacity: 0;
      }
      .todo {
        position: relative;
        width: 320px;
        margin: 16px 0;
      }
      .todo .toggle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40px;
        height: auto;
        margin: auto 0;
        opacity: 0;
      }
      .todo label {
        display: block;
        padding: 12px 12px 12px 48px;
        background: radial-gradient(
          circle at 20px 50%,
          transparent 9px,
          #94a3b8 10px,
          transparent 11px
        );
      }
      .todo .toggle:checked + label {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <button id="pulse" onclick="out.textContent = 'pulse clicked'">Upgrade</button>
    <button id="fade" onclick="out.textContent = 'fade clicked'">Continue</button>
    <button id="ghost">Invisible</button>
    <button id="late" disabled onclick="out.textContent = 'late clicked'">Submit</button>
    <div class="todo">
      <input
        class="toggle"
        type="checkbox"
        data-testid="todo-toggle"
        onchange="out.textContent = this.checked ? 'todo done' : 'todo open'"
      />
      <label>Water the plants</label>
    </div>
    <p id="out"></p>
    <script>
      setTimeout(() => document.querySelector('#fade').classList.add('shown'), 700);
      setTimeout(() => {
        document.querySelector('#late').disabled = false;
      }, 900);
    </script>
  </body>
</html>
