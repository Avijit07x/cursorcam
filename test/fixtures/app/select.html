<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Select</title>
  </head>
  <body
    style="
      font:
        16px system-ui,
        sans-serif;
      margin: 40px;
    "
  >
    <label for="size">Size</label>
    <select id="size">
      <option>Small</option>
      <option>Medium</option>
      <option>Large</option>
    </select>
    <label for="when">Start date</label>
    <input id="when" type="date" />
    <button title="Delete">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="3" y="4" width="10" height="11" fill="currentColor" />
      </svg>
    </button>
  </body>
</html>
